# Publishes the npm package from a pushed release tag, so the registry
# artifact is provably built from the tagged commit rather than from whatever
# happened to be in someone's working tree.
#
# Auth is OIDC "trusted publishing" — no stored secrets, nothing to rotate.
# One-time registry setup: npmjs.com -> @profoundry-us/highball -> Settings ->
# Trusted publisher -> GitHub Actions, naming this repo
# (profoundry-us/highball-runner) and this workflow filename (publish.yml).
#
# The publish step is skipped when the version already exists, so a partial
# failure is safe to re-run via workflow_dispatch.
name: Publish Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: 'Existing tag to (re-)publish, e.g. v0.3.0'

permissions:
  contents: read
  id-token: write # OIDC token for trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify the tag matches package.json
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_ENV"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json ($VERSION) — refusing to publish."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # The MCP server reads assets/dashboard.html at runtime, so a files
      # whitelist that drops it produces a package that installs fine and then
      # fails the moment a host asks for the widget. Fail here instead.
      - name: Verify the tarball carries its runtime assets
        run: |
          files=$(npm pack --dry-run --json | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>
              console.log(JSON.parse(d)[0].files.map(f=>f.path).join('\n')))")
          echo "$files"
          for required in bin/highball.js lib/mcp.js lib/run.js assets/dashboard.html; do
            echo "$files" | grep -qx "$required" || {
              echo "::error::$required is missing from the package."
              exit 1
            }
          done

      - name: Skip if this version is already published
        run: |
          if npm view "@profoundry-us/highball@${version}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_ENV"
            echo "@profoundry-us/highball@${version} is already on the registry — will skip."
          fi

      # Trusted publishing needs a current npm CLI; the one bundled with the
      # Node runtime is usually too old to negotiate OIDC.
      - name: Update npm
        if: env.published != 'true'
        run: npm install -g npm@latest && npm --version

      - name: Publish
        if: env.published != 'true'
        run: npm publish --access public --provenance

      - name: Summary
        run: |
          echo "## Published v${version}" >> "$GITHUB_STEP_SUMMARY"
          echo "- NPM: https://www.npmjs.com/package/@profoundry-us/highball/v/${version}" >> "$GITHUB_STEP_SUMMARY"
